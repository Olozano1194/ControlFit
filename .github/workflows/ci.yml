name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
        env:
          SECRET_KEY: ci-test-key-not-for-production
          DATABASE_URL: ""
      - run: python manage.py test gimnasioApp
        env:
          SECRET_KEY: ci-test-key-not-for-production
          DATABASE_URL: ""

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gimnasioReact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gimnasioReact/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
